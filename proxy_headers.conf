# Shared by every proxied location.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Spring reads this to decide whether the request arrived over HTTPS. Without it, redirect
# URLs and cookie handling behind a proxy are wrong in ways that are painful to diagnose.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_http_version 1.1;
proxy_read_timeout 120s;
