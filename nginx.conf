server {
    listen 80;
    # Also bind IPv6. Inside the container "localhost" can resolve to ::1 first, so an
    # IPv4-only listener makes health checks fail against a server that is working.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The build emits .gz and .br alongside each asset; serve them rather than recompressing.
    gzip_static on;

    # Everything the backend owns. Kept as separate locations rather than one catch-all so it
    # stays obvious which paths leave the browser's origin and which are the SPA's own routes.
    location /api/     { proxy_pass http://backend:8080; include /etc/nginx/proxy_headers.conf; }
    location /auth/    { proxy_pass http://backend:8080; include /etc/nginx/proxy_headers.conf; }
    location /oauth2/  { proxy_pass http://backend:8080; include /etc/nginx/proxy_headers.conf; }
    # Google returns the user to /login/oauth2/code/google, which Spring Security handles.
    location /login/   { proxy_pass http://backend:8080; include /etc/nginx/proxy_headers.conf; }

    # Client-side routing: /admin and /courses are React routes, not files on disk, so anything
    # that is not a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard. index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
